services:
  # 1. 무인 경비원 (자동 HTTPS)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      backend:
        condition: service_healthy

  # 2. 프론트엔드
  frontend:
    build: ./frontend
    restart: always
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  # 3. 백엔드 (12초 만에 Healthy 완벽 성공!)
  backend:
    build: ./backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://garnetadmin:garnetpass123!@db:5432/garnetdb
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  # 4. 데이터베이스 (PostgreSQL - 6초 만에 Healthy 완벽 성공!)
  db:
    image: postgres:15-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=garnetadmin
      - POSTGRES_PASSWORD=garnetpass123!
      - POSTGRES_DB=garnetdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garnetadmin -d garnetdb"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # 5. 모니터링 관리툴 (옵션)
  portainer:
    image: portainer/portainer-ce:latest
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  portainer_data:
